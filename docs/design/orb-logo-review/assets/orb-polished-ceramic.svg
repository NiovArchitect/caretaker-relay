<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Caretaker Relay orb — polished ceramic">
  <defs>
    <radialGradient id="pc-body" cx="36%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#7EC8D0"/>
      <stop offset="22%" stop-color="#2A95A4"/>
      <stop offset="50%" stop-color="#0F6B7A"/>
      <stop offset="78%" stop-color="#0B3D48"/>
      <stop offset="100%" stop-color="#071820"/>
    </radialGradient>
    <radialGradient id="pc-hi" cx="30%" cy="26%" r="38%">
      <stop offset="0%" stop-color="#F4FCFC" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#F4FCFC" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F4FCFC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pc-rim" cx="50%" cy="55%" r="52%">
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <circle cx="64" cy="64" r="56" fill="url(#pc-body)"/>
