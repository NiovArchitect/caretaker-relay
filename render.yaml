# Render Blueprint — Caretaker Relay caregiver UI (static)
#
# Prefer Static Site pointing at this repo, or Docker nginx image.
# VITE_CARE_API_URL must be the PUBLIC HTTPS Care API origin at build time.
#
# Secrets/URLs: set in Render dashboard. Do not commit secrets.

services:
  - type: web
    runtime: static
    name: caretaker-relay-web
    branch: checkpoint/caretaker-relay-track1-2026-07-22
    rootDir: .
    # vendor/ is committed so file: deps resolve without monorepo sibling
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: false
    envVars:
      - key: VITE_CARE_TRANSPORT
        value: http
      - key: VITE_CARE_MODE
        value: fixture
      # Public Care API HTTPS base (no trailing slash), e.g. https://caretaker-relay-care-api.onrender.com
      - key: VITE_CARE_API_URL
        sync: false
